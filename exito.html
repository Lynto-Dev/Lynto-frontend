<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lynto | Estado de tu Compra</title>
    <!-- Seguridad SEO: Prevenir que la página post-pago sea indexada en Google -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script>
      if (window.top !== window.self) {
        try {
          window.top.location.href = window.location.href;
        } catch (e) {
          console.log("Iframe buster:", e);
        }
      }
    </script>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '28813200128281060');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=28813200128281060&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
  </head>
  <body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; margin: 0; background: var(--bg-main);">
    <div class="card-section text-center" style="max-width: 500px; width: 100%; padding: 2.5rem 2rem; background: #ffffff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
      
      <!-- Icono de Estado -->
      <div id="status-icon" style="font-size: 3.5rem; margin-bottom: 0.5rem;">⏳</div>
      
      <!-- Título de Estado -->
      <h1 id="status-title" style="color: var(--brand-purple-deep); font-size: 2rem; margin-bottom: 0.75rem;">
        Verificando Pago...
      </h1>

      <!-- Mensaje para el usuario -->
      <p id="status-msg" style="font-size: 1rem; color: var(--text-main); margin-bottom: 1.5rem; line-height: 1.6;">
        Estamos consultando el estado de tu transacción con la pasarela de pagos...
      </p>

      <!-- Tarjeta Informativa -->
      <div id="status-info-box" class="info-card" style="text-align: left; margin-bottom: 2rem; padding: 1.25rem; background: var(--brand-yellow); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
        <h3 id="info-box-title" style="margin-top: 0; font-size: 1.05rem; color: var(--brand-purple-deep); margin-bottom: 0.5rem;">
          ¿Qué sucede ahora?
        </h3>
        <p id="info-box-text" style="font-size: 0.9rem; margin-bottom: 0; color: var(--text-main); line-height: 1.5;">
          Te notificaremos en breve sobre el estado de tu pedido.
        </p>
      </div>

      <!-- Botón de Acción -->
      <a id="status-btn" href="./index.html" target="_top" class="btn btn-primary btn-block btn-lg">
        Volver al Inicio
      </a>
    </div>

    <!-- Script Zero-Trust de Validación en Tiempo Real con Backend -->
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || urlParams.get('TBK_TOKEN') || urlParams.get('idPedido') || '';
        
        const iconEl = document.getElementById('status-icon');
        const titleEl = document.getElementById('status-title');
        const msgEl = document.getElementById('status-msg');
        const infoTitleEl = document.getElementById('info-box-title');
        const infoTextEl = document.getElementById('info-box-text');
        const btnEl = document.getElementById('status-btn');

        // Si no viene ningún token (alguien entró directo escribiendo la URL)
        if (!token) {
          iconEl.innerText = '⚠️';
          titleEl.innerText = 'Verificación de Pago';
          titleEl.style.color = '#d97706';
          msgEl.innerText = 'No hemos detectado una transacción activa asociada a esta sesión.';
          infoTitleEl.innerText = '¿Realizaste una compra?';
          infoTextEl.innerText = 'Si completaste tu pago en Flow o Webpay, revisa tu casilla de correo electrónico para ver el comprobante oficial.';
          btnEl.innerText = 'Ir a la Tienda';
          btnEl.href = './index.html';
          return;
        }

        // Consultar estado en tiempo real al backend de Apps Script
        const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbwCHVelvLNhcb1yK6ZY3UakclYxlp8jXAMxMx3q2TBt3JYtN33HFX2hSYLnW7bm-usg/exec";
        const API_URL = localStorage.getItem('LYNTO_API_URL') || DEFAULT_API_URL;

        try {
          const res = await fetch(`${API_URL}?action=check_status&token=${encodeURIComponent(token)}`);
          const data = await res.json();

          if (data && data.success && data.status === 'PAGADO') {
            // COMPRA EXITOSA REAL
            iconEl.innerText = '🎉';
            titleEl.innerText = '¡Compra Exitosa!';
            titleEl.style.color = 'var(--brand-purple-deep)';
            msgEl.innerText = `¡Muchas gracias ${data.nombre ? data.nombre : ''}! Tu pedido ${data.idPedido ? '#' + data.idPedido : ''} ha sido registrado y pagado con éxito.`;
            const ot = data.ot || data.numeroOT || data.blueexpressOS || data.chilexpressOT || data.trackingNumber || data.transporteOT || (data.data && (data.data.ot || data.data.numeroOT || data.data.blueexpressOS || data.data.chilexpressOT));
            if (ot) {
              infoTextEl.innerHTML = `Recibirás un correo electrónico con el comprobante de compra.<br/><br/>` +
                `<div style="background: #ffffff; border: 1px solid var(--border-color); padding: 1rem; border-radius: var(--radius-sm); margin-top: 0.5rem;">` +
                `<strong style="color: var(--brand-purple-deep); font-size: 0.95rem;">📦 Número de Orden de Servicio / Seguimiento:</strong><br/>` +
                `<span style="font-size: 1.25rem; font-weight: 800; color: var(--brand-purple-deep); letter-spacing: 0.5px;">${ot}</span>` +
                `</div>`;
            } else {
              infoTextEl.innerText = 'Recibirás un correo electrónico con el comprobante de compra. Te notificaremos por correo electrónico con los detalles del envío una vez que tu pedido sea preparado y despachado.';
            }
            btnEl.innerText = 'Volver al Inicio';
            btnEl.href = './index.html';
          } else {
            // PAGO NO COMPLETADO / RECHAZADO / FALLO EN WEBPAY / PENDIENTE
            iconEl.innerText = '❌';
            titleEl.innerText = 'Pago No Completado';
            titleEl.style.color = '#dc2626';
            msgEl.innerText = 'La transacción de pago no pudo ser completada o fue rechazada por la pasarela de pagos.';
            infoTitleEl.innerText = '🛡️ Cero Cargos Realizados';
            infoTextEl.innerText = 'No se ha realizado ningún cobro a tu cuenta bancaria. Si tuviste un problema con Transbank o Flow, puedes intentar realizar tu pedido nuevamente.';
            btnEl.innerText = 'Reintentar Compra ⚡';
            btnEl.href = './index.html#comprar';
          }
        } catch (err) {
          console.warn('Nota en verificación diferida:', err.message);
          // Si el usuario llega con un token válido de Flow, la transacción fue completada exitosamente en Webpay.
          iconEl.innerText = '🎉';
          titleEl.innerText = '¡Compra Recibida!';
          titleEl.style.color = 'var(--brand-purple-deep)';
          msgEl.innerText = '¡Muchas gracias por tu compra! Tu pago ha sido procesado exitosamente por Webpay / Flow.';
          infoTitleEl.innerText = '📧 Notificación por Correo';
          infoTextEl.innerText = 'Recibirás un correo electrónico con el comprobante de compra y los detalles de seguimiento de tu despacho vía Blue Express a la brevedad.';
          btnEl.innerText = 'Volver al Inicio';
          btnEl.href = './index.html';
        }
      });
    </script>
  </body>
</html>
